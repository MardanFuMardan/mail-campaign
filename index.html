<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Noon Campaign Hub — مولد الإيميلات والبريفات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c; --card: rgba(22,22,27,.75); --border: rgba(255,255,255,.08);
      --yellow: #feee00; --text: #f4f4f5; --muted: #9d9da8; --ok: #34d399; --err: #f87171; --blue: #60a5fa;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Cairo', sans-serif; color: var(--text); min-height: 100vh; margin: 0;
      background: radial-gradient(1100px 500px at 50% -10%, #1c1c04 0%, var(--bg) 55%) fixed;
      padding: 16px 14px 60px;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    @keyframes rise { from { opacity:0; transform: translateY(16px);} to { opacity:1; transform:none; } }
    .rise { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay:.07s } .d2 { animation-delay:.14s }

    header { text-align: center; margin-bottom: 18px; }
    .logo { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%; background: var(--yellow); color:#000; font-weight: 900; font-size: 27px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(254,238,0,.25); }
    h1 { font-size: 22px; font-weight: 900; margin: 0; } h1 span { color: var(--yellow); }
    .sub { color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 4px; }

    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px; margin-bottom: 14px; backdrop-filter: blur(14px); box-shadow: 0 18px 40px -18px rgba(0,0,0,.8); }
    .card h2 { font-size: 14.5px; font-weight: 800; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }

    label { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
    input, select, textarea {
      width: 100%; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.1); border-radius: 11px;
      color: var(--text); font-family: inherit; font-size: 14px; padding: 11px 12px; outline: none; transition: .25s;
    }
    textarea { resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(254,238,0,.1); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .row2, .row3 { grid-template-columns: 1fr; } }

    .btn { border: none; border-radius: 12px; padding: 12px 18px; font-family: inherit; font-weight: 800; font-size: 13.5px; cursor: pointer; transition: .2s; }
    .btn:active { transform: scale(.98); }
    .btn-y { background: linear-gradient(135deg, var(--yellow), #e8d900); color: #000; width: 100%; }
    .btn-g { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--border); }
    .btn-r { background: rgba(248,113,113,.1); color: var(--err); border: 1px solid rgba(248,113,113,.3); }
    .btn-sm { padding: 7px 12px; font-size: 12px; border-radius: 9px; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; background: rgba(0,0,0,.4); padding: 5px; border-radius: 12px; border: 1px solid var(--border); }
    .tab { flex: 1; min-width: 90px; border: none; background: transparent; color: var(--muted); font-family: inherit; font-weight: 800; font-size: 12px; padding: 9px 6px; border-radius: 8px; cursor: pointer; transition: .25s; white-space: nowrap; }
    .tab.active { background: var(--yellow); color: #000; }

    .subject-bar { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.4); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
    .subject-bar .lbl { font-size: 11px; font-weight: 800; color: var(--muted); flex-shrink: 0; }
    .subject-bar .txt { flex: 1; font-size: 13px; font-weight: 700; direction: ltr; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .output { background: #fff; color: #222; border-radius: 14px; padding: 26px 22px; line-height: 1.9; font-size: 14px; min-height: 300px; max-height: 62vh; overflow-y: auto; direction: ltr; text-align: left; }
    .output.rtl-out { direction: rtl; text-align: right; }
    .output a { color: #0284c7; }

    .copy-fab {
      position: fixed; bottom: 22px; inset-inline-end: 22px; z-index: 60;
      border: none; border-radius: 99px; padding: 14px 26px; font-family: inherit; font-weight: 900; font-size: 14px;
      background: #fff; color: #000; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 0 2px var(--yellow);
      transition: .25s;
    }
    .copy-fab:hover { transform: scale(1.05); background: var(--yellow); }
    @keyframes copiedPulse { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.7);} 100% { box-shadow: 0 0 0 18px rgba(52,211,153,0);} }
    .copy-fab.copied { background: var(--ok); color: #000; animation: copiedPulse .6s ease; }

    .camp-item { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
    .camp-item .nm { flex: 1; font-weight: 800; font-size: 13.5px; }
    .camp-item .nm small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; margin-top: 2px; }
    .badge { font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: rgba(52,211,153,.1); color: var(--ok); border: 1px solid rgba(52,211,153,.3); }
    .badge.off { background: rgba(148,163,184,.1); color: #cbd5e1; border-color: rgba(148,163,184,.3); }
    .adminbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; padding: 10px 12px; border-radius: 11px; background: rgba(254,238,0,.05); border: 1px solid rgba(254,238,0,.16); font-size: 11.5px; font-weight: 700; color: #fde68a; }
    .adminbar .btn { flex-shrink: 0; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding: 24px 14px; overflow-y: auto; }
    .modal-bg.show { display: flex; }
    .modal { background: #131318; border: 1px solid var(--border); border-radius: 18px; padding: 22px; width: 100%; max-width: 680px; animation: rise .4s cubic-bezier(.16,1,.3,1) both; }
    .modal h3 { margin: 0 0 16px; font-size: 17px; font-weight: 900; }
    .modal textarea { font-family: monospace; font-size: 12px; direction: ltr; text-align: left; min-height: 180px; line-height: 1.6; }
    .hint { font-size: 11px; font-weight: 600; padding: 9px 12px; border-radius: 10px; margin-top: 8px; line-height: 1.7; background: rgba(254,238,0,.05); border: 1px solid rgba(254,238,0,.16); color: #fde68a; }
    .status-msg { display: none; margin-top: 10px; padding: 11px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 700; }
    .status-msg.ok { display: block; background: rgba(52,211,153,.07); border: 1px solid rgba(52,211,153,.25); color: #6ee7b7; }
    .status-msg.err { display: block; background: rgba(248,113,113,.07); border: 1px solid rgba(248,113,113,.25); color: #fca5a5; }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--yellow); }
  </style>
</head>
<body>
<div class="wrap">

  <header class="rise">
    <div class="logo" onclick="handleLogoSecretClick()" style="cursor:pointer" title="noon">n</div>
    <h1>Noon <span>Campaign Hub</span></h1>
    <div class="sub">مولد الإيميلات والبريفات — كل الشهور من مكان واحد</div>
  </header>

  <div class="grid">

    <!-- SIDE -->
    <div>
      <div class="card rise d1">
        <h2>⚙️ بيانات الإيميل</h2>
        <label>الحملة</label>
        <select id="campaignId" onchange="onCampaignChange()"></select>

        <label>اسم المؤثر</label>
        <input id="infName" placeholder="e.g. Ahmed" oninput="render()">

        <div class="row2">
          <div>
            <label>الدولة</label>
            <select id="country" onchange="onCountryChange()">
              <option value="QA">Qatar (QA)</option>
              <option value="KW">Kuwait (KW)</option>
              <option value="BH">Bahrain (BH)</option>
              <option value="OM">Oman (OM)</option>
            </select>
          </div>
          <div>
            <label>كود الخصم</label>
            <input id="discountCode" placeholder="افتراضي من الحملة" oninput="render()">
          </div>
        </div>

        <label>المرحلة (Phase)</label>
        <select id="selectedPhase" onchange="render()"></select>

        <label>المنصة المتفق عليها</label>
        <input id="platform" placeholder="e.g. Instagram Reels & TikTok" oninput="render()">

        <div class="row2">
          <div>
            <label>تاريخ التسليم</label>
            <div style="display:flex; gap:6px" dir="ltr">
              <input type="number" id="subDay" placeholder="Day" min="1" max="31" oninput="render()" style="width:38%">
              <select id="subMonth" onchange="render()" style="width:62%"></select>
            </div>
          </div>
          <div>
            <label>تاريخ النشر (Go Live)</label>
            <div style="display:flex; gap:6px" dir="ltr">
              <input type="number" id="liveDay" placeholder="Day" min="1" max="31" oninput="render()" style="width:38%">
              <select id="liveMonth" onchange="render()" style="width:62%"></select>
            </div>
          </div>
        </div>

        <label>قيمة الحملة (AED)</label>
        <input type="number" id="fee" placeholder="e.g. 500" oninput="render()">

        <label>هدف المشاهدات (اختياري)</label>
        <input id="kpiTarget" placeholder="e.g. 100K — يترك فارغاً للنسبة الافتراضية 50%" oninput="render()">

        <label>اسم المرسل</label>
        <input id="senderName" placeholder="Mahmoud" oninput="render()">

        <button class="btn btn-y" style="margin-top:16px" onclick="render(true)">⚡ توليد الإيميل والبريف</button>
      </div>

      <div class="card rise d2" id="mgrCard" style="display:none">
        <h2>🗂️ مدير الحملات</h2>
        <div class="adminbar" id="adminBar">
          <span id="adminState">👤 وضع مستخدم عادي — العرض فقط</span>
          <button class="btn btn-g btn-sm" style="margin-inline-start:auto" id="adminBtn" onclick="adminAction()">🔑 دخول المدير</button>
        </div>
        <div id="campaignList"></div>
        <div style="display:flex; gap:8px; margin-top:12px" id="mgrActions">
          <button class="btn btn-y btn-sm" style="flex:1" onclick="openEditor()">➕ حملة جديدة</button>
          <button class="btn btn-y btn-sm" style="background:#22c55e; color:#000" onclick="publishChangesToGitHub()">🚀 حفظ ونشر على Vercel</button>
          <button class="btn btn-g btn-sm" onclick="exportCampaigns()">⬇️ تصدير</button>
          <button class="btn btn-g btn-sm" onclick="document.getElementById('importFile').click()">⬆️ استيراد</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importCampaigns(this.files)">
        </div>
        <div class="status-msg" id="mgrStatus"></div>
      </div>
    </div>

    <!-- OUTPUT -->
    <div class="card rise d2" style="position:sticky; top:16px">
      <div class="subject-bar">
        <span class="lbl">SUBJECT:</span>
        <span class="txt" id="subjectText">—</span>
        <button class="btn btn-g btn-sm" onclick="copySubject(this)">📋</button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchOut('email-en',this)">Email EN</button>
        <button class="tab" onclick="switchOut('email-ar',this)">Email AR</button>
        <button class="tab" onclick="switchOut('brief-en',this)">Brief EN</button>
        <button class="tab" onclick="switchOut('brief-ar',this)">Brief AR</button>
      </div>
      <div class="output" id="out-email-en"></div>
      <div class="output rtl-out" id="out-email-ar" style="display:none" dir="rtl"></div>
      <div class="output" id="out-brief-en" style="display:none"></div>
      <div class="output rtl-out" id="out-brief-ar" style="display:none" dir="rtl"></div>
      <button class="copy-fab" id="copyFab" onclick="copyCurrent(this)">📋 نسخ المحتوى المعروض</button>
    </div>
  </div>
</div>

<!-- محرر الحملة -->
<div class="modal-bg" id="editorModal">
  <div class="modal">
    <h3 id="editorTitle">حملة جديدة</h3>
    <label>اسم الحملة (EN)</label>
    <input id="ed_nameEn" placeholder="Noon GCC September Campaign 2026">
    <div class="row2">
      <div><label>اسم الحملة (AR)</label><input id="ed_nameAr" placeholder="حملة نون لدول الخليج - شهر سبتمبر"></div>
      <div><label>الشهر (EN / AR)</label>
        <div style="display:flex; gap:6px">
          <input id="ed_monthEn" placeholder="September">
          <input id="ed_monthAr" placeholder="سبتمبر">
        </div>
      </div>
    </div>
    <div class="row2">
      <div><label>كود الخصم الافتراضي</label><input id="ed_promoCode" placeholder="PROMO15"></div>
      <div><label>اسم المرسل الافتراضي</label><input id="ed_sender" placeholder="Mahmoud"></div>
    </div>
    <div class="row2">
      <div><label>لينك البريف (Brief)</label><input id="ed_briefUrl" dir="ltr" style="text-align:left" placeholder="https://... (اختياري)"></div>
      <div><label>لينك دليل التصوير (Guide)</label><input id="ed_guideUrl" dir="ltr" style="text-align:left" placeholder="https://..."></div>
    </div>
    <div class="row2">
      <div><label>لينك البريف الإنجليزي (Brief EN)</label><input id="ed_briefUrlEn" dir="ltr" style="text-align:left" placeholder="https://..."></div>
      <div><label>لينك البريف العربي (Brief AR)</label><input id="ed_briefUrlAr" dir="ltr" style="text-align:left" placeholder="https://..."></div>
    </div>
    <div class="row2">
      <div><label>لينك بورتال الفواتير</label><input id="ed_portalUrl" dir="ltr" style="text-align:left" placeholder="https://..."></div>
      <div><label>الهاشتاقات</label><input id="ed_hashtags" dir="ltr" style="text-align:left" placeholder="#noon #noonGCC ..."></div>
    </div>

    <label>خصومات الدول + حسابات التاج (JSON)</label>
    <textarea id="ed_discounts" spellcheck="false"></textarea>
    <label>المراحل (Phases JSON)</label>
    <textarea id="ed_phases" spellcheck="false"></textarea>
    <div class="hint">لو مش متأكد من صيغة JSON: انسخ حملة موجودة (زر تكرار) وعدّل عليها — ده أسرع وأأمن</div>
    <div class="status-msg" id="edStatus"></div>
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn btn-y" style="flex:1" onclick="saveCampaign()">💾 حفظ</button>
      <button class="btn btn-g" onclick="closeEditor()">إلغاء</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   NOON CAMPAIGN HUB CLIENT
   ============================================================ */

var currentOut = 'email-en';
var cachedResult = null;
var CAMPAIGNS = [];
var STATIC = null;
var isAdmin = false;

var COUNTRIES = { QA: 'Qatar', KW: 'Kuwait', BH: 'Bahrain', OM: 'Oman' };
var MONTHS_AR = { '01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'مايو','06':'يونيو','07':'يوليو','08':'أغسطس','09':'سبتمبر','10':'أكتوبر','11':'نوفمبر','12':'ديسمبر' };
var MONTHS_EN = { '01':'January','02':'February','03':'March','04':'April','05':'May','06':'June','07':'July','08':'August','09':'September','10':'October','11':'November','12':'December' };

async function loadMasterData(token) {
  var headers = {};
  var t = token || sessionStorage.getItem('noon_admin_token');
  if (t) headers['Authorization'] = 'Bearer ' + t;
  try {
    const res = await fetch('/api/content', { headers: headers, cache: 'no-store' });
    if (res.ok) {
      const json = await res.json();
      if (json.success && json.data) {
        if (json.data.static) STATIC = json.data.static;
        CAMPAIGNS = json.data.campaigns || [];
        if (json.isAdmin) isAdmin = true;
        return true;
      }
    }
  } catch (e) {
    console.error('Error loading campaign data:', e);
  }
  return false;
}

/* ---------- UI Helpers ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s); }
function visibleCampaigns() { return CAMPAIGNS.filter(function (c) { return !c.hidden; }); }

function currentCampaign() {
  var id = $('campaignId').value;
  var vis = visibleCampaigns();
  return vis.filter(function (c) { return c.id === id; })[0] || vis[0] || CAMPAIGNS[0];
}

function fillCampaignSelect() {
  var sel = $('campaignId');
  var cur = sel.value;
  var vis = visibleCampaigns();
  sel.innerHTML = vis.map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.nameEn) + '</option>';
  }).join('');
  if (vis.some(function (c) { return c.id === cur; })) sel.value = cur;
  onCampaignChange(true);
}

function fillMonthSelects() {
  var opts = Object.keys(MONTHS_EN).map(function (k) {
    return '<option value="' + k + '">' + MONTHS_EN[k] + ' / ' + MONTHS_AR[k] + '</option>';
  }).join('');
  $('subMonth').innerHTML = opts;
  $('liveMonth').innerHTML = opts;
  $('subMonth').value = '08';
  $('liveMonth').value = '08';
}

function onCampaignChange(keep) {
  var c = currentCampaign();
  if (!c) return;
  var ps = $('selectedPhase');
  ps.innerHTML = (c.phases || []).map(function (p, ix) {
    var title = p.en ? p.en.title : (p.title || '');
    var date = p.en ? p.en.date : (p.date || '');
    return '<option value="' + ix + '">' + (ix + 1) + '. ' + esc(title) + ' (' + esc(date) + ')</option>';
  }).join('');
  if (!keep) render();
}

function defaultCodeFor(country, c) {
  if (!c) return 'PROMO15';
  var m = c.countryDiscounts && c.countryDiscounts[country];
  if (m) {
    var str = typeof m === 'string' ? m : (m.en || '');
    var x = str.match(/code \(?([A-Z0-9]{3,20})\)?/);
    if (x) return x[1];
  }
  return c.promoCode || 'PROMO15';
}

function onCountryChange() {
  var c = currentCampaign();
  var cur = $('discountCode').value.trim();
  var def = defaultCodeFor($('country').value, c);
  if (!cur || cur === def || cur === 'FIRST20' || cur === 'PROMO15' || cur === 'PROMO10') {
    $('discountCode').value = def;
  }
  render();
}

function getInputs() {
  var c = currentCampaign();
  var country = $('country').value;
  return {
    name: $('infName').value.trim(),
    country: country,
    code: ($('discountCode').value.trim() || defaultCodeFor(country, c)),
    phaseIx: parseInt($('selectedPhase').value || '0', 10),
    platform: $('platform').value.trim(),
    subDay: $('subDay').value.trim(),
    subMonth: $('subMonth').value,
    liveDay: $('liveDay').value.trim(),
    liveMonth: $('liveMonth').value,
    fee: $('fee').value.trim(),
    kpi: $('kpiTarget').value.trim(),
    sender: $('senderName').value.trim() || (c ? c.sender : 'Mahmoud') || 'Mahmoud'
  };
}

/* ---------- Secure Server-Side Rendering ---------- */
var renderTimer = null;
function render(immediate) {
  clearTimeout(renderTimer);
  if (immediate) {
    doRender();
  } else {
    renderTimer = setTimeout(doRender, 150);
  }
}

async function doRender() {
  var c = currentCampaign();
  if (!c) return;
  var I = getInputs();

  try {
    var res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...I, campaignId: c.id })
    });
    var d = await res.json();
    if (d.success) {
      cachedResult = d;
      updateGeneratedViews(d);
    }
  } catch (err) {
    console.error('Render failed:', err);
  }
}

function updateGeneratedViews(d) {
  if (!d) return;
  if (d.subjects) {
    $('subjectText').textContent = d.subjects[currentOut] || d.subjects['email-en'] || '—';
  }
  $('out-email-en').innerHTML = d.emailEn || '';
  $('out-email-ar').innerHTML = d.emailAr || '';
  $('out-brief-en').innerHTML = d.briefEn || '';
  $('out-brief-ar').innerHTML = d.briefAr || '';
}

/* ---------- Tab Switch & Copy ---------- */
function switchOut(id, btn) {
  currentOut = id;
  ['email-en', 'email-ar', 'brief-en', 'brief-ar'].forEach(function (k) {
    $('out-' + k).style.display = k === id ? 'block' : 'none';
  });
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  btn.classList.add('active');
  if (cachedResult && cachedResult.subjects) {
    $('subjectText').textContent = cachedResult.subjects[currentOut] || cachedResult.subjects['email-en'] || '—';
  }
}

function copyCurrent(btn) {
  var el = $('out-' + currentOut);
  copyRich(el, btn);
}
function copySubject(btn) {
  var tmp = document.createElement('textarea');
  tmp.value = $('subjectText').textContent;
  document.body.appendChild(tmp); tmp.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(tmp);
  flash(btn, '📋 ✅');
}
function copyRich(el, btn) {
  var range = document.createRange();
  range.selectNodeContents(el);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  try { document.execCommand('copy'); } catch (e) {}
  sel.removeAllRanges();
  flash(btn, '✅ تم النسخ');
}
function flash(btn, txt) {
  var old = btn.textContent;
  btn.textContent = txt;
  if (btn.classList.contains('copy-fab')) {
    btn.classList.add('copied');
    setTimeout(function () { btn.classList.remove('copied'); btn.textContent = old; }, 1800);
  } else {
    setTimeout(function () { btn.textContent = old; }, 1500);
  }
}

/* ---------- Hidden Admin Access ---------- */
var logoClicks = 0;
var logoTimer = null;
function handleLogoSecretClick() {
  logoClicks++;
  clearTimeout(logoTimer);
  if (logoClicks >= 3) {
    logoClicks = 0;
    adminAction();
    return;
  }
  logoTimer = setTimeout(function() { logoClicks = 0; }, 800);
}

document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.altKey && (e.key === 'a' || e.key === 'A' || e.key === 'ش')) {
    e.preventDefault();
    adminAction();
    return false;
  }
});

async function adminAction() {
  if (isAdmin) {
    if (confirm('هل تريد تسجيل الخروج من وضع المدير؟')) {
      logoutAdmin();
    }
    return;
  }
  var pass = prompt('🔐 كلمة مرور المدير:');
  if (pass === null || !pass.trim()) return;
  pass = pass.trim();

  try {
    var res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', password: pass })
    });
    var data = await res.json();
    if (res.ok && data.success) {
      isAdmin = true;
      sessionStorage.setItem('noon_admin_token', data.token);
      await loadMasterData(data.token);
      applyAdminUI();
      fillCampaignSelect();
      mgrStatus('أهلاً يا مدير 👑 — الصلاحيات مفعلة', true);
    } else {
      alert(data.error || 'كلمة المرور غير صحيحة ❌');
    }
  } catch (err) {
    alert('خطأ في الاتصال بالخادم: ' + err.message);
  }
}

function logoutAdmin() {
  sessionStorage.removeItem('noon_admin_token');
  isAdmin = false;
  applyAdminUI();
  loadMasterData();
  fillCampaignSelect();
  mgrStatus('خرجت من وضع المدير — رجعت مستخدم عادي', true);
}

function applyAdminUI() {
  if ($('mgrCard')) $('mgrCard').style.display = isAdmin ? 'block' : 'none';
  if ($('adminBar')) $('adminBar').style.display = isAdmin ? 'flex' : 'none';
  $('adminState').textContent = isAdmin ? '👑 وضع المدير — صلاحيات كاملة' : '👤 وضع مستخدم عادي — العرض فقط';
  $('adminBtn').textContent = isAdmin ? '🚪 خروج' : '🔑 دخول المدير';
  $('mgrActions').style.display = isAdmin ? 'flex' : 'none';
  renderList();
}

/* ---------- Admin Campaign Management ---------- */
var editingId = null;

function renderList() {
  $('campaignList').innerHTML = CAMPAIGNS.map(function (c) {
    var adminBtns = isAdmin
      ? '<button class="btn btn-g btn-sm" title="' + (c.hidden ? 'إظهار في القائمة' : 'إخفاء من القائمة') + '" onclick="toggleHidden(\'' + c.id + '\')">' + (c.hidden ? '🙈' : '👁️') + '</button>' +
        '<button class="btn btn-g btn-sm" onclick="duplicateCampaign(\'' + c.id + '\')">📄</button>' +
        '<button class="btn btn-g btn-sm" onclick="openEditor(\'' + c.id + '\')">✏️</button>' +
        '<button class="btn btn-r btn-sm" onclick="deleteCampaign(\'' + c.id + '\')">🗑️</button>'
      : '';
    return '<div class="camp-item"' + (c.hidden ? ' style="opacity:.55"' : '') + '>' +
      '<div class="nm">' + esc(c.nameEn) + (c.hidden ? ' <span class="badge off">مخفية</span>' : '') + '<small>' + esc(c.nameAr) + '</small></div>' +
      adminBtns +
      '</div>';
  }).join('') || '<div style="color:var(--muted); font-size:12.5px; text-align:center; padding:10px">مفيش حملات — ' + (isAdmin ? 'ضيف واحدة' : 'كلم المدير') + '</div>';
}

function toggleHidden(id) {
  var c = CAMPAIGNS.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  c.hidden = !c.hidden;
  renderList();
  fillCampaignSelect();
  mgrStatus((c.hidden ? 'الحملة اتخفيت من قائمة التوليد 🙈' : 'الحملة ظهرت تاني 👁️'), true);
}

function openEditor(id) {
  if (!isAdmin) { mgrStatus('محتاج دخول المدير الأول 🔑', false); return; }
  editingId = id || null;
  var c = id ? CAMPAIGNS.filter(function (x) { return x.id === id; })[0] : null;
  $('editorTitle').textContent = c ? 'تعديل حملة: ' + c.nameEn : 'حملة جديدة';
  $('ed_nameEn').value = c ? c.nameEn : '';
  $('ed_nameAr').value = c ? c.nameAr : '';
  $('ed_monthEn').value = c ? c.monthEn : '';
  $('ed_monthAr').value = c ? c.monthAr : '';
  $('ed_promoCode').value = c ? c.promoCode : 'PROMO15';
  $('ed_sender').value = c ? (c.sender || 'Mahmoud') : 'Mahmoud';
  $('ed_briefUrl').value = c ? (c.briefUrl || '') : '';
  $('ed_briefUrlEn').value = c ? (c.briefUrlEn || '') : '';
  $('ed_briefUrlAr').value = c ? (c.briefUrlAr || '') : '';
  $('ed_guideUrl').value = c ? (c.guideUrl || '') : '';
  $('ed_portalUrl').value = c ? (c.portalUrl || 'https://noon-invoice.vercel.app/') : 'https://noon-invoice.vercel.app/';
  $('ed_hashtags').value = c ? (c.hashtags || '#noon #noonGCC') : '#noon #noonGCC';

  var defDiscounts = {
    QA: { en: "15% off up to QAR 50 on noon express & noon one with code (FIRST20)", ar: "خصم 15% بحد أقصى 50 ر.ق على نون إكسبرس ونون ون بكود (FIRST20)", tag: "@noon_qatar" },
    KW: { en: "15% off up to KWD 5 on noon express & noon one with code (FIRST20)", ar: "خصم 15% بحد أقصى 5 د.ك على نون إكسبرس ونون ون بكود (FIRST20)", tag: "@noon_kuwait" },
    BH: { en: "15% off up to BHD 5 on noon express & noon one with code (FIRST20)", ar: "خصم 15% بحد أقصى 5 د.ب على نون إكسبرس ونون ون بكود (FIRST20)", tag: "@noon_bahrain" },
    OM: { en: "15% off up to OMR 5 on noon express & noon one with code (FIRST20)", ar: "خصم 15% بحد أقصى 5 ر.ع على نون إكسبرس ونون ون بكود (FIRST20)", tag: "@noon_oman" }
  };

  $('ed_discounts').value = JSON.stringify(c ? c.countryDiscounts : defDiscounts, null, 2);
  $('ed_phases').value = JSON.stringify(c ? c.phases : [], null, 2);
  $('edStatus').className = 'status-msg';
  $('editorModal').classList.add('show');
}

function closeEditor() { $('editorModal').classList.remove('show'); }
function newCampaignId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function saveCampaign() {
  if (!isAdmin) { edStatus('محتاج دخول المدير الأول 🔑'); return; }
  try {
    var discounts = JSON.parse($('ed_discounts').value || '{}');
    var phases = JSON.parse($('ed_phases').value || '[]');
    if (!$('ed_nameEn').value.trim()) throw new Error('اسم الحملة بالإنجليزية مطلوب');
    if (!phases.length) throw new Error('لازم مرحلة واحدة على الأقل');
    var prev = editingId ? CAMPAIGNS.filter(function (x) { return x.id === editingId; })[0] : null;
    var obj = {
      id: editingId || newCampaignId(),
      nameEn: $('ed_nameEn').value.trim(),
      nameAr: $('ed_nameAr').value.trim() || $('ed_nameEn').value.trim(),
      monthEn: $('ed_monthEn').value.trim() || 'Month',
      monthAr: $('ed_monthAr').value.trim() || 'شهر',
      promoCode: $('ed_promoCode').value.trim() || 'PROMO15',
      sender: $('ed_sender').value.trim() || 'Mahmoud',
      briefUrl: $('ed_briefUrl').value.trim(),
      briefUrlEn: $('ed_briefUrlEn').value.trim(),
      briefUrlAr: $('ed_briefUrlAr').value.trim(),
      guideUrl: $('ed_guideUrl').value.trim(),
      portalUrl: $('ed_portalUrl').value.trim(),
      hashtags: $('ed_hashtags').value.trim(),
      hidden: prev ? !!prev.hidden : false,
      countryDiscounts: discounts,
      phases: phases
    };
    if (editingId) {
      CAMPAIGNS = CAMPAIGNS.map(function (c) { return c.id === editingId ? obj : c; });
    } else {
      CAMPAIGNS.push(obj);
    }
    renderList();
    fillCampaignSelect();
    $('campaignId').value = obj.id;
    onCampaignChange();
    closeEditor();
    mgrStatus('تم حفظ التعديل محلياً ✅ — اضغط "حفظ ونشر على Vercel" لاعتمادها نهائياً', true);
  } catch (e) {
    edStatus(e.message);
  }
}

function duplicateCampaign(id) {
  if (!isAdmin) { mgrStatus('محتاج دخول المدير الأول 🔑', false); return; }
  var c = CAMPAIGNS.filter(function (x) { return x.id === id; })[0];
  if (!c) return;
  var copy = JSON.parse(JSON.stringify(c));
  copy.id = newCampaignId();
  copy.nameEn = copy.nameEn + ' (COPY)';
  CAMPAIGNS.push(copy);
  renderList();
  mgrStatus('تم التكرار — افتح التعديل وغيّر بيانات الشهر الجديد ✅', true);
}

function deleteCampaign(id) {
  if (!isAdmin) { mgrStatus('محتاج دخول المدير الأول 🔑', false); return; }
  if (!confirm('متأكد من حذف الحملة؟')) return;
  CAMPAIGNS = CAMPAIGNS.filter(function (c) { return c.id !== id; });
  renderList();
  fillCampaignSelect();
}

function exportCampaigns() {
  if (!isAdmin) { mgrStatus('محتاج دخول المدير الأول 🔑', false); return; }
  var blob = new Blob([JSON.stringify(CAMPAIGNS, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'noon-campaigns-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function importCampaigns(files) {
  if (!isAdmin) { mgrStatus('محتاج دخول المدير الأول 🔑', false); return; }
  if (!files || !files[0]) return;
  var r = new FileReader();
  r.onload = function (e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('الملف لازم يكون مصفوفة حملات');
      var existingIds = CAMPAIGNS.map(function (c) { return c.id; });
      var added = 0, skipped = 0;
      data.forEach(function (c) {
        if (!c.phases || !c.phases.length) return;
        if (c.id && existingIds.indexOf(c.id) > -1) { skipped++; return; }
        if (!c.id) c.id = 'c' + Date.now() + Math.floor(Math.random() * 999);
        CAMPAIGNS.push(c); added++;
      });
      renderList();
      fillCampaignSelect();
      if (!added && skipped) mgrStatus('كل الحملات موجودة بالفعل — مفيش حاجة جديدة', false);
      else mgrStatus('تم استيراد ' + added + ' حملة' + (skipped ? ' (تجاهل ' + skipped + ' موجودة)' : '') + ' ✅', true);
    } catch (err) {
      mgrStatus('فشل الاستيراد: ' + err.message, false);
    }
  };
  r.readAsText(files[0]);
}

async function publishChangesToGitHub() {
  var token = sessionStorage.getItem('noon_admin_token');
  if (!token) { alert('يجب تسجيل الدخول كمدير أولاً'); return; }

  var ghToken = prompt('أدخل GitHub Personal Access Token (PAT) للنشر التلقائي:', localStorage.getItem('noon_gh_token') || '');
  if (ghToken === null) return;
  ghToken = ghToken.trim();
  if (ghToken) localStorage.setItem('noon_gh_token', ghToken);

  mgrStatus('جاري الحفظ والـ Commit على GitHub... ⏳', true);

  try {
    var res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        githubToken: ghToken,
        commitMessage: 'تحديث قوالب وبيانات الحملات من لوحة الإدارة',
        data: {
          static: STATIC,
          campaigns: CAMPAIGNS
        }
      })
    });
    var data = await res.json();
    if (res.ok && data.success) {
      mgrStatus(data.message || 'تم النشر بنجاح! 🚀 Vercel يقوم بالتحديث التلقائي الآن.', true);
    } else {
      mgrStatus(data.error || 'فشل النشر', false);
    }
  } catch (err) {
    mgrStatus('خطأ: ' + err.message, false);
  }
}

function mgrStatus(msg, ok) {
  var el = $('mgrStatus');
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
}
function edStatus(msg) {
  var el = $('edStatus');
  el.className = 'status-msg err';
  el.textContent = msg;
}

/* ---------- App Initialization ---------- */
(async function init() {
  fillMonthSelects();
  await loadMasterData();
  applyAdminUI();
  fillCampaignSelect();
  var c = currentCampaign();
  if (c) {
    $('senderName').value = c.sender || 'Mahmoud';
  }
  render(true);

  if (window.location.pathname.endsWith('/admin') || window.location.search.indexOf('admin') !== -1) {
    setTimeout(function() {
      adminAction();
    }, 300);
  }
})();
</script>
