<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ بريف حملة نون - أغسطس</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Tajawal', 'Inter', 'sans-serif'], },
                    colors: { 
                        bgBase: '#09090b',      
                        cardBase: '#18181b',    
                        borderSoft: '#27272a',  
                        noonYellow: '#facc15',  
                        noonHover: '#eab308'    
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #e4e4e7; -webkit-font-smoothing: antialiased; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #facc15; }
        
        /* Directions */
        .brief-ltr { direction: ltr; text-align: left; font-family: Arial, sans-serif; }
        .brief-rtl { direction: rtl; text-align: right; font-family: Arial, sans-serif; }
        .divider { border-top: 1px dashed #cbd5e1; margin: 18px 0; }
        
        /* UI Micro-interactions */
        .hover-scale { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease; }
        .hover-scale:hover { transform: scale(1.015); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .hover-scale:active { transform: scale(0.98); }
        
        .input-focus { transition: all 0.3s ease; background-color: #121214; }
        .input-focus:focus-within { box-shadow: 0 0 0 1px #facc15; border-color: #facc15; background-color: #09090b; }
        .input-focus:focus-within label { color: #facc15; }
        
        .glass-panel { 
            background: rgba(24, 24, 27, 0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border: 1px solid rgba(39, 39, 42, 1); 
        }

        /* Staggered Animations */
        .animate-fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(15px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans selection:bg-noonYellow selection:text-black">

    <div class="max-w-[1400px] mx-auto">
        <header class="mb-10 flex items-center justify-between animate-fade-in">
            <div>

                    إعدادات البريف (August) <span class="text-noonYellow">📝</span>
                </h1>
                <p class="text-zinc-400 mt-1 text-sm font-medium">نظام التاغات التلقائي وتوليد الأدلة الإرشادية للحملة الجديدة.</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 animate-fade-in delay-100">
                <div class="glass-panel rounded-2xl p-6 h-fit max-h-[85vh] overflow-y-auto custom-scrollbar relative overflow-hidden shadow-2xl hover-scale">
                    
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 to-amber-600"></div>

                    <div class="space-y-5 mt-2">

                            <label class="block text-[11px] font-bold text-zinc-500 mb-1 px-3 pt-2 text-right transition-colors">المرحلة المخصصة (Phase)</label>
                            <div class="relative px-1 pb-1">
                                <select id="selectedPhase" class="w-full bg-[#18181b] border border-borderSoft rounded-lg px-3 py-2 text-white text-sm appearance-none focus:outline-none focus:border-noonYellow cursor-pointer transition-colors" dir="ltr">
                                    <option value="1">1. Grand Lifestyle Reset (Aug 7-10)</option>
                                    <option value="2">2. Beauty Campaign (Aug 6-9)</option>
                                    <option value="3">3. Mega Tech Festival (Aug 10-13)</option>
                                    <option value="4">4. Health & Nutrition (Aug 13-16)</option>
                                    <option value="5">5. Fashion Campaign (Aug 20-23)</option>
                                    <option value="6">6. Back To School Sale (Aug 14-31)</option>
                                    <option value="7">7. Salalah Khareef Festival (Oman)</option>
                                </select>
                                <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">

                                </div>
                            </div>
                        </div>

                        <!-- Field 2 -->
                        <div class="group relative input-focus rounded-xl border border-borderSoft p-1">
                            <label class="block text-[11px] font-bold text-zinc-500 mb-1 px-3 pt-2 text-right transition-colors">منصة النشر (Platform)</label>
                            <input type="text" id="platform" value="Instagram Reels" placeholder="e.g. TikTok & Instagram Reels" class="w-full bg-transparent border-none px-3 pb-2 text-white placeholder-zinc-700 focus:outline-none focus:ring-0 text-left text-sm" dir="ltr">
                        </div>

                        <!-- Field 3 -->
                        <div class="group relative input-focus rounded-xl border border-borderSoft p-1">
                            <label class="block text-[11px] font-bold text-zinc-500 mb-1 px-3 pt-2 text-right transition-colors">الدولة وكود الخصم (للتاغ التلقائي)</label>
                            <div class="flex gap-2 px-1 pb-1">
                                <div class="relative w-1/2">
                                    <select id="country" class="w-full bg-[#18181b] border border-borderSoft rounded-lg px-3 py-2 text-white text-sm appearance-none focus:outline-none focus:border-noonYellow cursor-pointer transition-colors" dir="ltr">
                                        <option value="QA">Qatar (QA)</option>
                                        <option value="KW">Kuwait (KW)</option>
                                        <option value="BH">Bahrain (BH)</option>
                                        <option value="OM">Oman (OM)</option>
                                    </select>
                                    <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">

                                    </div>
                                </div>

                            </div>
                        </div>

            </div>

            <div class="lg:col-span-8 flex flex-col gap-5 animate-fade-in delay-200">
                
                <!-- Action Bar -->

                    <div class="flex gap-1 bg-bgBase p-1 rounded-lg border border-borderSoft">
                        <button onclick="setLanguage('en')" id="btn-en" class="px-5 py-1.5 rounded-md text-xs font-bold bg-white text-black shadow-sm transition-all duration-200">English</button>
                        <button onclick="setLanguage('ar')" id="btn-ar" class="px-5 py-1.5 rounded-md text-xs font-bold text-zinc-400 hover:text-white transition-all duration-200">العربية</button>
                    </div>
                    
                    <button onclick="copyContent('brief-body-output', 'copySuccessMsg')" class="relative flex items-center gap-2 bg-noonYellow hover:bg-noonHover text-black font-semibold py-2 px-5 rounded-lg text-sm shadow-md transition-all duration-200 hover:scale-105 active:scale-95">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>

                    </button>

                    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-yellow-300 to-yellow-500"></div>
                    <div id="brief-body-output" class="text-zinc-900 overflow-y-auto custom-scrollbar text-[14px] leading-[1.6] flex-1 brief-ltr" dir="ltr">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLanguage = 'en';

        const countryDiscounts = {
            'QA': { en: '<strong>New Users:</strong> 15% off up to 75 QAR<br><strong>Returning Users:</strong> 5% off up to 25 QAR', ar: '<strong>العملاء الجدد:</strong> خصم 15% بحد أقصى 75 ريال قطري<br><strong>العملاء الحاليين:</strong> خصم 5% بحد أقصى 25 ريال قطري', tag: '@noon_Qar' },

        const phasesData = {
            '1': {
                en: { title: 'Grand Lifestyle Reset', date: 'August 7 – 10', categories: 'Home, Fashion, Lifestyle, & Daily Essentials', action: 'Download the noon app<br>• Show the Grand Lifestyle Reset campaign banner inside the app (screen recording)<br>• Highlight products from the featured categories<br>• Encourage users to explore the category through the banner', msg: 'Must-have picks from this category, Daily routine using these products' },
                ar: { title: 'انطلاقة أسلوب الحياة', date: '7 - 10 أغسطس', categories: 'المنزل، الأزياء، أسلوب الحياة، والأساسيات اليومية', action: 'تحميل تطبيق نون<br>• إظهار لافتة الحملة داخل التطبيق (تسجيل الشاشة)<br>• إبراز المنتجات من الفئات المحددة<br>• تشجيع المستخدمين على استكشاف الفئة عبر اللافتة', msg: 'مختارات لا غنى عنها من هذه الفئة، روتيني اليومي باستخدام هذه المنتجات' }
            },
            '2': {
                en: { title: 'Beauty Campaign', date: 'August 6 – 9', categories: 'Skincare, Makeup, Haircare, Fragrances, & Personal Care', action: 'Show the Beauty Campaign banner inside the app<br>• Showcase trending beauty, skincare, and routine products<br>• Direct users to browse beauty deals through the app banner', msg: 'Must-have picks from this category, Daily routine using these products' },
                ar: { title: 'حملة الجمال', date: '6 - 9 أغسطس', categories: 'العناية بالبشرة، المكياج، العناية بالشعر، العطور، والعناية الشخصية', action: 'إظهار لافتة حملة الجمال داخل التطبيق<br>• عرض منتجات الجمال والعناية بالبشرة الرائجة والروتين اليومي<br>• توجيه المستخدمين لتصفح عروض الجمال عبر لافتة التطبيق', msg: 'مختارات لا غنى عنها من هذه الفئة، روتيني اليومي باستخدام هذه المنتجات' }
            },
            '3': {
                en: { title: 'Mega Tech Festival', date: 'August 10 – 13', categories: 'Electronics, Laptops, TV & Appliances, Gaming, Telco & Gadgets', action: 'Show the Mega Tech Festival banner inside the app<br>• Showcase products from tech & electronics categories<br>• Direct users to browse tech deals through the app banner', msg: 'Best deals I found on noon, Unboxing / Try-On / Demo' },
                ar: { title: 'مهرجان التقنية الأكبر', date: '10 - 13 أغسطس', categories: 'الإلكترونيات، اللابتوبات، التلفزيونات والأجهزة المنزلية، الألعاب، الاتصالات', action: 'إظهار لافتة مهرجان التقنية داخل التطبيق<br>• عرض المنتجات من فئات التقنية والإلكترونيات<br>• توجيه المستخدمين لتصفح عروض التقنية عبر لافتة التطبيق', msg: 'أفضل العروض التي وجدتها على نون، فتح صندوق / استعراض' }
            },
            '4': {
                en: { title: 'Health & Nutrition Campaign', date: 'August 13 – 16', categories: 'Supplements, Fitness Accessories, Healthy Snacks, & Wellness', action: 'Show the Health & Nutrition campaign banner inside the app<br>• Highlight health, wellness, and workout essentials<br>• Direct users to discover nutrition offers via the dedicated app banner', msg: 'Must-have picks from this category, Daily routine using these products' },
                ar: { title: 'حملة الصحة والتغذية', date: '13 - 16 أغسطس', categories: 'المكملات الغذائية، إكسسوارات اللياقة البدنية، الوجبات الخفيفة الصحية، والعناية بالصحة', action: 'إظهار لافتة حملة الصحة والتغذية داخل التطبيق<br>• إبراز أساسيات الصحة والعافية والتمارين الرياضية<br>• توجيه المستخدمين لاكتشاف عروض التغذية عبر اللافتة', msg: 'مختارات لا غنى عنها من هذه الفئة، روتيني اليومي' }
            },
            '5': {
                en: { title: 'Fashion Campaign', date: 'August 20 – 23', categories: 'Apparel, Footwear, Watches & Eyewear, Bags & Accessories', action: 'Show the Fashion Campaign banner inside the app<br>• Showcase try-on hauls, style guides, or trending fashion items<br>• Direct users to explore fashion deals through the app banner', msg: 'Unboxing / Try-On / Demo, Shopping hauls for August deals' },
                ar: { title: 'حملة الأزياء', date: '20 - 23 أغسطس', categories: 'الملابس، الأحذية، الساعات والنظارات، الحقائب والإكسسوارات', action: 'إظهار لافتة حملة الأزياء داخل التطبيق<br>• عرض مشتريات الأزياء (Try-on Haul) وأدلة الأناقة<br>• توجيه المستخدمين لاستكشاف عروض الأزياء عبر اللافتة', msg: 'تجربة ملابس / استعراض، مشتريات عروض أغسطس' }
            },
            '6': {
                en: { title: 'Back To School Sale', date: 'August 14 – 31', categories: 'Stationery, Backpacks, Laptops & Tablets, School Supplies, Kids\' Fashion', action: 'Highlight essential items needed for the upcoming school year<br>• Direct users to the Back To School Sale section via the in-app banner', msg: 'Back-to-school essentials / Prep with me, Shopping hauls for August deals' },
                ar: { title: 'عروض العودة للمدارس', date: '14 - 31 أغسطس', categories: 'القرطاسية، حقائب الظهر، اللابتوبات والأجهزة اللوحية، المستلزمات المدرسية، أزياء الأطفال', action: 'إبراز العناصر الأساسية اللازمة للعام الدراسي القادم<br>• توجيه المستخدمين إلى قسم العودة للمدارس عبر اللافتة', msg: 'أساسيات العودة للمدارس / استعدوا معي، مشتريات عروض أغسطس' }
            },
            '7': {
                en: { title: 'Salalah Khareef Festival 2026', date: 'July – September', categories: 'Outdoor Sports & Active Apparel', action: 'Show the Salalah Khareef Festival banner inside the app<br>• Showcase outdoor sports gear, active apparel, or outdoor equipment perfect for the Khareef season<br>• Target the Omani market and travelers heading to Salalah<br>• Direct users to discover outdoor sports deals via the specialized app banner', msg: 'Celebrate the Salalah Khareef season with noon Oman<br>• Get ready for your outdoor adventures and mountain activities directly through the app<br>• Click the banner to check out all specialized outdoor sports gear<br>• Use my discount code for extra savings on your festival shopping in Oman' },
                ar: { title: 'مهرجان خريف صلالة 2026', date: 'يوليو - سبتمبر', categories: 'الرياضات الخارجية والملابس الرياضية', action: 'إظهار لافتة مهرجان خريف صلالة داخل التطبيق<br>• عرض معدات الرياضات الخارجية والملابس المثالية لموسم الخريف<br>• استهداف السوق العماني والمسافرين المتجهين إلى صلالة<br>• توجيه المستخدمين لاكتشاف عروض الرياضات الخارجية عبر اللافتة المخصصة', msg: 'احتفل بموسم خريف صلالة مع نون عُمان<br>• استعد لمغامراتك الخارجية والأنشطة الجبلية مباشرة عبر التطبيق<br>• اضغط على اللافتة للاطلاع على كافة معدات الرياضات الخارجية<br>• استخدم كود الخصم لتوفير إضافي لتسوقك للمهرجان في عُمان' }
            }

        const inputIds = ['selectedPhase', 'platform', 'discountCode', 'country'];

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            inputIds.forEach(id => {
                document.getElementById(id).addEventListener('input', renderBrief);
            });
            renderBrief();
        });

        function setLanguage(lang) {
            currentLanguage = lang;
            const btnEn = document.getElementById('btn-en');
            const btnAr = document.getElementById('btn-ar');
            const bodyOutput = document.getElementById('brief-body-output');

            const activeClass = "px-5 py-1.5 rounded-md text-xs font-bold bg-white text-black shadow-sm transition-all duration-200";
            const inactiveClass = "px-5 py-1.5 rounded-md text-xs font-bold text-zinc-400 hover:text-white transition-all duration-200";

            if(lang === 'en') {
                btnEn.className = activeClass;
                btnAr.className = inactiveClass;
                bodyOutput.className = "text-zinc-900 overflow-y-auto custom-scrollbar text-[14px] leading-[1.6] flex-1 brief-ltr";
                bodyOutput.setAttribute('dir', 'ltr');
            } else {
                btnAr.className = activeClass;
                btnEn.className = inactiveClass;
                bodyOutput.className = "text-zinc-900 overflow-y-auto custom-scrollbar text-[14px] leading-[1.6] flex-1 brief-rtl"; 
                bodyOutput.setAttribute('dir', 'rtl');
            }
            renderBrief();
        }

        function renderBrief() {
            const data = {};
            inputIds.forEach(id => { data[id] = document.getElementById(id).value; });
            localStorage.setItem('noonBriefAugustUI', JSON.stringify(data));

            const l = currentLanguage;
            const platform = data.platform || (l === 'en' ? '[Platform]' : '[المنصة]');
            const codeInput = data.discountCode ? data.discountCode.trim() : '';
            const code = codeInput || 'PROMO15';
            
            const phaseKey = data.selectedPhase || '1';
            const p = phasesData[phaseKey][l];
            
            const countryVal = data.country || 'QA';
            const discountText = countryDiscounts[countryVal][l];
            const countryTag = countryDiscounts[countryVal].tag;

            let htmlContent = "";

            if (l === 'en') {
                htmlContent = `
<div style="font-size: 15px; font-weight: 800; color: #000; margin-bottom: 2px;">
    NOON GCC AUGUST CAMPAIGN 2026
</div>
<div style="font-size: 12px; font-weight: 600; color: #71717a; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px;">
    Influencer Brief
</div>

<strong style="color: #0284c7; font-size: 13px; text-transform: uppercase;">🎯 CAMPAIGN WINDOW & CATEGORIES</strong><br><br>
<div style="background-color: #f0f9ff; padding: 12px; border-left: 3px solid #38bdf8; border-radius: 6px; margin-bottom: 12px;">
    <strong style="color: #0c4a6e; font-size: 14px;">Phase: ${p.title} (${p.date})</strong><br><br>
    <strong style="color: #0369a1;">Categories:</strong> <span style="color: #000;">${p.categories}</span><br><br>
    <strong style="color: #0369a1;">Content Requirements:</strong><br>
    <div style="color: #000; margin-top: 4px;">• ${p.action}</div>
</div>

<div class="divider"></div>
<strong style="color: #0284c7; font-size: 13px; text-transform: uppercase;">🏆 THE GOLDEN RULE — DISCOUNT CODE MANDATE</strong><br><br>
<div style="background-color: #fff7ed; padding: 12px; border-left: 3px solid #fb923c; border-radius: 6px; margin-bottom: 12px;">
    <div style="font-size: 14px; color: #c2410c; margin-bottom: 4px; font-weight: bold; text-transform: uppercase;">Discount Code</div>
    <div style="font-size: 20px; font-weight: bold; color: #ea580c; letter-spacing: 2px; margin-bottom: 8px; display: inline-block;">${code}</div>
    <div style="color: #9a3412; font-size: 14px;">
        <strong>Offer Details:</strong><br>${discountText}
    </div>
</div>
<div style="color: #3f3f46; margin-top: 8px; font-size: 13px;">
    The discount code <strong>MUST</strong> appear in every content format:<br>
    <ul style="margin:4px 0 0 0; padding-left:20px;">
        <li style="margin-bottom:2px;">Spoken and/or on-screen text in the video.</li>
        <li style="margin-bottom:2px;">Clearly written at the top or middle of the caption.</li>
        <li>In Stories with a link sticker/CTA.</li>
    </ul>
    <br><em>Examples: "Use code ${code} for extra savings" | "Don't forget to use the discount code ${code} on the noon app." | "Check the app for full offer details."</em>

        function loadSavedData() {
            const saved = localStorage.getItem('noonBriefAugustUI');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    inputIds.forEach(id => { if (parsed[id]) document.getElementById(id).value = parsed[id]; });
                } catch (e) {}
            }
        }

        function copyContent(elementId, msgId) {
            const el = document.getElementById(elementId);
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(el);
            selection.removeAllRanges();
            selection.addRange(range);
            try {
                document.execCommand('copy');
                const successMsg = document.getElementById(msgId);
                if (successMsg) {
                    successMsg.style.opacity = '1';
                    successMsg.style.transform = 'translate(-50%, -8px)';
                    setTimeout(() => {
                        successMsg.style.opacity = '0';
                        successMsg.style.transform = 'translate(-50%, 0)';
                    }, 2000);
                }
            } catch (err) {}
            selection.removeAllRanges();
        }
